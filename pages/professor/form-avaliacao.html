<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BrightFuture — Lançar Nota</title>
    <link rel="stylesheet" href="../../style.css">
    <script src="" defer></script>
</head>
<body>
    <header class="cabecalhoPrincipal">
        <nav class="menuNavegacao">
            <a href="alunos.html" class="linkMenu">Turmas</a>
            <a href="aulas.html" class="linkMenu">Registros de aula</a>
            <a href="avaliacoes.html" class="linkMenu linkAtivo">Avaliações</a>
        </nav>

        <a href="perfil-profissional.html" class="perfilUsuario" id="linkPerfilUsuario">
            <span id="nomeUsuario">Prof. André</span>
            <span class="avatarIniciais" id="iniciaisUsuario">AN</span>
        </a>
    </header>

    <main class="conteudoPrincipal">
        <h1 class="tituloPagina" id="tituloFormAvaliacao">LANÇAR NOTA</h1>

        <section class="cardFormulario">
            <form id="formAvaliacao" class="formularioPadrao">
                <div class="campoFormulario">
                    <label for="seletorTurmaAvaliacaoForm" class="rotuloCampo">Turma</label>
                    <select id="seletorTurmaAvaliacaoForm" class="seletorCampo" required>
                        <option value="8-ano-A">8º ano A</option>
                        <option value="8-ano-B">8º ano B</option>
                        <option value="9-ano-A">9º ano A</option>
                    </select>
                </div>

                <div class="campoFormulario">
                    <label for="inputDataAvaliacao" class="rotuloCampo">Data</label>
                    <input type="date" id="inputDataAvaliacao" class="entradaData" required>
                </div>

                <div class="campoFormulario">
                    <label for="seletorTipoAvaliacao" class="rotuloCampo">Tipo</label>
                    <select id="seletorTipoAvaliacao" class="seletorCampo" required>
                        <option value="Prova Bimestral I">Prova Bimestral I</option>
                        <option value="Prova Bimestral II">Prova Bimestral II</option>
                        <option value="Trabalho">Trabalho</option>
                        <option value="Atividade">Atividade</option>
                    </select>
                </div>

                <div class="secaoListaNotas">
                    <h2 class="subtituloSecao">Lista de alunos</h2>
                    <table class="tabelaNotas" id="tabelaNotas">
                        <thead>
                            <tr>
                                <th>Aluno</th>
                                <th>Nota</th>
                            </tr>
                        </thead>
                        <tbody id="corpoListaNotas">
                            <tr class="linhaNota">
                                <td>
                                    <div class="celulaAluno">
                                        <span class="avatarAluno">FO</span>
                                        <span class="nomeAluno">Fulano</span>
                                    </div>
                                </td>
                                <td>
                                    <input type="number" class="entradaNota" min="0" max="10" step="0.1" placeholder="0,0">
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <div class="rodapeFormulario">
                    <a href="avaliacoes.html" class="botaoSecundario" id="btnCancelarAvaliacao">Cancelar</a>
                    <button type="submit" class="botaoPrimario" id="btnSalvarNotas">Lançar notas</button>
                </div>
            </form>
        </section>
    </main>
</body>
</html>
