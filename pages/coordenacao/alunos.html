<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BrightFuture — Alunos (Coordenação)</title>
    <link rel="stylesheet" href="../../style.css">
</head>
<body>
    <header class="cabecalhoPrincipal">
        <nav class="menuNavegacao">
            <a href="painel.html" class="linkMenu">Painel</a>
            <a href="alunos.html" class="linkMenu linkAtivo">Alunos</a>
            <a href="diarios.html" class="linkMenu">Diários</a>
        </nav>

        <a href="perfil-profissional.html" class="perfilUsuario" id="linkPerfilUsuario">
            <span id="nomeUsuario">Juliana</span>
            <span class="avatarIniciais" id="iniciaisUsuario">JU</span>
        </a>
    </header>

    <main class="conteudoPrincipal">
        <h1 class="tituloPagina">ALUNOS</h1>

        <div class="barraBusca">
            <input type="search" id="inputBuscaCoordenacao" class="campoBusca" placeholder="Busca">
            <span class="iconeBusca">🔍︎</span>
        </div>

        <div class="barraControles" id="barraControlesCoordenacao">
            <div class="grupoFiltros">
                <div class="campoFiltro">
                    <label for="seletorSegmentoCoordenacao" class="rotuloFiltro">Segmento</label>
                    <select id="seletorSegmentoCoordenacao" class="seletorFiltro">
                        <option value="">Todos</option>
                        <option value="Fundamental" selected>Fundamental</option>
                        <option value="Medio">Médio</option>
                    </select>
                </div>

                <div class="campoFiltro">
                    <label for="seletorSerieCoordenacao" class="rotuloFiltro">Série</label>
                    <select id="seletorSerieCoordenacao" class="seletorFiltro">
                        <option value="">Todas</option>
                        <option value="8-ano">8º ano</option>
                        <option value="9-ano">9º ano</option>
                    </select>
                </div>

                <div class="campoFiltro">
                    <label for="seletorTurmaCoordenacao" class="rotuloFiltro">Turma</label>
                    <select id="seletorTurmaCoordenacao" class="seletorFiltro">
                        <option value="">Todas</option>
                        <option value="A">Turma A</option>
                        <option value="B">Turma B</option>
                    </select>
                </div>

                <div class="campoFiltro">
                    <label for="seletorSituacaoCoordenacao" class="rotuloFiltro">Situação</label>
                    <select id="seletorSituacaoCoordenacao" class="seletorFiltro">
                        <option value="">Todas</option>
                        <option value="Ativo">Ativo</option>
                        <option value="Atencao">Atenção</option>
                    </select>
                </div>
            </div>
        </div>

        <section class="cardTabela">
            <table class="tabelaDados" id="tabelaAlunosCoordenacao">
                <thead>
                    <tr>
                        <th>Aluno</th>
                        <th>Série</th>
                        <th>Média Geral</th>
                        <th>Frequência</th>
                        <th>Situação</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody id="corpoTabelaCoordenacao">
                    <tr>
                        <td>
                            <div class="celulaAluno">
                                <span class="avatarAluno">FO</span>
                                <span class="nomeAluno">Fulano</span>
                            </div>
                        </td>
                        <td>8º ano A</td>
                        <td>5,2</td>
                        <td><span class="celulaFrequencia statusAtencao">71%</span></td>
                        <td><span class="alertaSituacao statusAtencao">Atenção ⚠</span></td>
                        <td><a href="perfil-aluno.html?matricula=103123" class="linkDetalhes">↗</a></td>
                    </tr>
                </tbody>
            </table>
        </section>
    </main>
</body>
</html>
