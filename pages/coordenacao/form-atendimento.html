<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BrightFuture — Registrar Atendimento</title>
    <link rel="stylesheet" href="../../style.css">
</head>
<body>
    <header class="cabecalhoPrincipal">
        <nav class="menuNavegacao">
            <a href="painel.html" class="linkMenu">Painel</a>
            <a href="alunos.html" class="linkMenu">Alunos</a>
            <a href="diarios.html" class="linkMenu">Diários</a>
        </nav>

        <a href="perfil-profissional.html" class="perfilUsuario" id="linkPerfilUsuario">
            <span id="nomeUsuario">Juliana</span>
            <span class="avatarIniciais" id="iniciaisUsuario">JU</span>
        </a>
    </header>

    <main class="conteudoPrincipal">
        <h1 class="tituloPagina">REGISTRAR ATENDIMENTO</h1>

        <section class="cardFormulario">
            <form id="formAtendimento" class="formularioPadrao">
                <div class="campoFormulario">
                    <label for="inputAlunoAtendimento" class="rotuloCampo">Aluno</label>
                    <input type="text" id="inputAlunoAtendimento" class="entradaTexto campoSomenteLeitura" value="Fulano — 8º ano A" readonly>
                </div>

                <div class="campoFormulario">
                    <label for="seletorResponsavelAtendimento" class="rotuloCampo">Responsável Contatado</label>
                    <select id="seletorResponsavelAtendimento" class="seletorCampo" required>
                        <option value="Maria (Mãe)">Maria (Mãe) — (41) 98888-7777</option>
                        <option value="Sicrano (Pai)">Sicrano (Pai) — (41) 99999-9999</option>
                    </select>
                </div>

                <div class="campoFormulario">
                    <label for="seletorCanalAtendimento" class="rotuloCampo">Canal de Contato</label>
                    <select id="seletorCanalAtendimento" class="seletorCampo" required>
                        <option value="Ligação Telefônica">Ligação Telefônica</option>
                        <option value="WhatsApp">WhatsApp</option>
                        <option value="Reunião Presencial">Reunião Presencial</option>
                    </select>
                </div>

                <div class="campoFormulario">
                    <label for="inputDataAtendimento" class="rotuloCampo">Data</label>
                    <input type="date" id="inputDataAtendimento" class="entradaData" required>
                </div>

                <div class="campoFormulario">
                    <label for="textareaResumoAtendimento" class="rotuloCampo">Resumo do Atendimento e Encaminhamento</label>
                    <textarea id="textareaResumoAtendimento" class="areaTexto" rows="4" placeholder="Descreva o motivo do contato e o combinado com a família..." required></textarea>
                </div>

                <div class="rodapeFormulario">
                    <a href="perfil-aluno.html" class="botaoSecundario" id="btnCancelarAtendimento">Cancelar</a>
                    <button type="submit" class="botaoPrimario" id="btnSalvarAtendimento">Salvar atendimento</button>
                </div>
            </form>
        </section>
    </main>
</body>
</html>
